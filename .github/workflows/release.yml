# Skillsmith 桌面版：构建 Windows 安装包 + 发布 Release
#
# 设计要点：
#  · 仓库只放源码，二进制走 Release 附件（行业标准做法）。
#    别人不用 clone + npm install 下 464MB 的 Electron 才有 exe。
#  · 推 tag（v*）才发 Release；推 main 只做构建验证 + 存 artifact。
#  · 发布用 GitHub runner 自带的 gh CLI，不引第三方 action —— 少一个供应链环节。
#  · 无代码签名证书，跳过签名（CI 里设 CSC_IDENTITY_AUTO_DISCOVERY=false）。

name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '同时发布 Release 的 tag（如 v1.0.0）。留空则只构建、不发布。'
        required: false
        default: ''

permissions:
  contents: write

# 同一个分支只跑一次，新的推送取消旧的
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 取完整历史：发布说明要用 tag 的 message，需要能读到 tag
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Install dependencies
        working-directory: electron
        env:
          # Electron 37+ 不再有自带的 postinstall，我们在 package.json 里
          # 补了 postinstall 调 install.js 来下载运行时（~250MB）。
          # 镜像地址末尾不能带 v —— @electron/get 的 BASE_URL 不含 v，
          # 版本号自带的 v 前缀由它自己拼，多写会变成 vv45.2.1 直接 404。
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
        run: npm ci

      - name: Unit tests
        working-directory: .
        # 每个测试都自带沙箱（临时真源 + 临时端 + 配置备份还原），
        # runner 上没有真实技能目录也能跑完。
        #
        # 必须显式用 bash：Windows runner 默认 shell 是 pwsh，
        # 多行 run 里外部命令的退出码不会中断后续步骤 ——
        # 中间某个套件挂了、最后一个过了，CI 会假绿。
        # bash 默认带 -eo pipefail，任何一条失败立即停。
        shell: bash
        run: |
          node test_agent_config.js
          node test_rebind_broken.js
          node test_client_state.js
          node test_safety.js
          node test_installer.js
          node test_search.js

      - name: Stage app files
        working-directory: electron
        run: node stage.js

      - name: Build NSIS installer
        working-directory: electron
        env:
          # 没有代码签名证书，跳过签名流程（否则 electron-builder 会去找证书失败）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # 用官方源。runner 在 GitHub 机房，直连最快。
          # 若在受限网络里构建，可换成：
          #   ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          #   ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
        run: |
          npx electron-builder --win --x64 --publish never --config.electronDist="node_modules/electron/dist"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Skillsmith-Setup-${{ github.sha }}
          path: electron/dist/*.exe
          if-no-files-found: error

      - name: Publish Release
        # 只在打 tag 时发布；手动触发时可指定 tag。
        #
        # 注意条件写法：必须先判 github.event_name。
        # 非手动触发时 inputs 上下文为空，null != '' 在 Actions 表达式里
        # 是 true —— 直接写 inputs.tag != '' 会导致 push 到 main 也去发 Release。
        if: >-
          startsWith(github.ref, 'refs/tags/v')
          || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $tag = $env:TAG
          if (-not $tag) { throw "TAG 为空，终止发布" }
          Write-Host "Publishing release: $tag"

          # 正文来源有二，按优先级：
          #   1) annotated tag 自己的 message（写 tag 时写的说明）
          #   2) CHANGELOG.md 里对应版本的段落（回退）
          #
          # 为什么不用 --notes-from-tag：它取的是 tag 指向的 commit 的 message，
          # 不是 tag 对象的 message。
          # 为什么不能直接塞进 --notes：多行文本会被 shell 按空白拆成多个参数，
          # gh 会把第二行当成 flag 报 unknown shorthand flag。
          #
          # 必须显式 fetch tag 对象：actions/checkout 在 tag 触发时建的是
          # lightweight 引用，%(contents) 会退化成 commit message（实测踩过）。
          git fetch --force --tags origin

          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.md"
          $tagType = (git cat-file -t $tag 2>$null).Trim()

          if ($tagType -eq 'tag') {
            git tag -l $tag --format='%(contents)' | Out-File -FilePath $notesFile -Encoding utf8
            Write-Host "notes source: annotated tag ($tagType)"
          } else {
            # 回退：从 CHANGELOG 里取对应版本段
            $raw = Get-Content "CHANGELOG.md" -Raw
            $m = [regex]::Match($raw, "(?ms)^##\s+$([regex]::Escape($tag))\b(.*?)(?=^##\s|\z)")
            if ($m.Success) {
              $m.Groups[1].Value.Trim() | Out-File -FilePath $notesFile -Encoding utf8
            } else {
              $raw | Out-File -FilePath $notesFile -Encoding utf8
            }
            Write-Host "notes source: CHANGELOG (tag type was '$tagType')"
          }

          Write-Host "--- notes preview ---"
          Get-Content $notesFile -TotalCount 3

          gh release create $tag `
            "electron/dist/*.exe" `
            --title "Skillsmith $tag" `
            --notes-file $notesFile `
            --verify-tag
